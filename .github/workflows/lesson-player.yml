name: Build EIU Lesson Player
on:
  workflow_dispatch:
  push:
    tags: ['player-v*']
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: dist:win
          - os: macos-latest
            command: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-player/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop-player
      - run: npm --prefix desktop-player run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/package-player.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: EIU-Lesson-Player-${{ matrix.os }}
          path: |
            desktop-player/dist/EIU-Lesson-Player-*.zip
            desktop-player/dist/SHA256SUMS-*.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktop-player/dist/EIU-Lesson-Player-*.zip
            desktop-player/dist/SHA256SUMS-*.txt
          name: EIU Lesson Player ${{ github.ref_name }}
          body: |
            EIU Lesson Player for Windows 10/11 and macOS (Apple Silicon / Intel).
            Download, extract, and follow the included installation guide.
            Lessons run locally in the same isolated renderer as Learning Space.
            These initial builds are unsigned; see the included guide for OS prompts.
