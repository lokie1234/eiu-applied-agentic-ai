<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="list" aria-label="7 Best Practices to remember">
<text x="550" y="37" text-anchor="middle" fill="#144069" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700"><tspan>7 Best Practices to remember</tspan></text>
<g data-best-practice="1" role="listitem"><rect x="10" y="64" width="1080" height="60" rx="12" fill="#f3f7fa" stroke="#bfd2df"/><circle cx="42" cy="94" r="17" fill="#144069"/><text x="42" y="100" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan>1</tspan></text><text fill="#17324a" font-family="Arial, Helvetica, sans-serif" font-size="22"><tspan x="82" y="101">Your root cause analysis is only as good as the info you collect.</tspan></text></g>
<g data-best-practice="2" role="listitem"><rect x="10" y="132" width="1080" height="60" rx="12" fill="#f3f7fa" stroke="#bfd2df"/><circle cx="42" cy="162" r="17" fill="#144069"/><text x="42" y="168" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan>2</tspan></text><text fill="#17324a" font-family="Arial, Helvetica, sans-serif" font-size="22"><tspan x="82" y="169">Your knowledge (or lack of it) can get in the way of a good root cause analysis.</tspan></text></g>
<g data-best-practice="3" role="listitem"><rect x="10" y="200" width="1080" height="60" rx="12" fill="#f3f7fa" stroke="#bfd2df"/><circle cx="42" cy="230" r="17" fill="#144069"/><text x="42" y="236" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan>3</tspan></text><text fill="#17324a" font-family="Arial, Helvetica, sans-serif" font-size="22"><tspan x="82" y="237">You have to understand what happened before you can understand why it happened.</tspan></text></g>
<g data-best-practice="4" role="listitem"><rect x="10" y="268" width="1080" height="60" rx="12" fill="#f3f7fa" stroke="#bfd2df"/><circle cx="42" cy="298" r="17" fill="#144069"/><text x="42" y="304" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan>4</tspan></text><text fill="#17324a" font-family="Arial, Helvetica, sans-serif" font-size="22"><tspan x="82" y="305">Interviews are not about asking questions.</tspan></text></g>
<g data-best-practice="5" role="listitem"><rect x="10" y="336" width="1080" height="60" rx="12" fill="#f3f7fa" stroke="#bfd2df"/><circle cx="42" cy="366" r="17" fill="#144069"/><text x="42" y="372" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan>5</tspan></text><text fill="#17324a" font-family="Arial, Helvetica, sans-serif" font-size="22"><tspan x="82" y="373">You can’t solve all human performance problems with discipline, training, and procedures.</tspan></text></g>
<g data-best-practice="6" role="listitem"><rect x="10" y="404" width="1080" height="60" rx="12" fill="#f3f7fa" stroke="#bfd2df"/><circle cx="42" cy="434" r="17" fill="#144069"/><text x="42" y="440" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan>6</tspan></text><text fill="#17324a" font-family="Arial, Helvetica, sans-serif" font-size="22"><tspan x="82" y="441">Often people can’t see effective corrective actions even if they can find the root cause.</tspan></text></g>
<g data-best-practice="7" role="listitem"><rect x="10" y="472" width="1080" height="60" rx="12" fill="#f3f7fa" stroke="#bfd2df"/><circle cx="42" cy="502" r="17" fill="#144069"/><text x="42" y="508" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"><tspan>7</tspan></text><text fill="#17324a" font-family="Arial, Helvetica, sans-serif" font-size="22"><tspan x="82" y="509">All investigations do not need to be equal (but some steps can’t be skipped).</tspan></text></g>
</svg>
